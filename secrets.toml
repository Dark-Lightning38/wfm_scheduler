# =============================================================
# WFM Scheduler — secrets template
# =============================================================
# Copy this file to .streamlit/secrets.toml locally (do NOT commit it).
# In Streamlit Cloud, paste the same content into Settings → Secrets.
# Generate bcrypt hashes with:
#   python -c "import bcrypt; print(bcrypt.hashpw(b'mypassword', bcrypt.gensalt()).decode())"
# =============================================================

[auth]
cookie_name = "wfm_scheduler_auth"
cookie_key  = "REPLACE_WITH_32+_CHARS_OF_RANDOMNESS"
expiry_days = 1

[auth.credentials.jsmith]
email    = "jsmith@ap.com"
name     = "John Smith"
password = "$2b$12$REPLACE_BCRYPT_HASH_HERE"
roles    = ["admin"]

[auth.credentials.alice]
email    = "alice@ap.com"
name     = "Alice Martin"
password = "$2b$12$REPLACE_BCRYPT_HASH_HERE"
roles    = ["viewer"]
